<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS · Simple POS</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="pos-body">

  <header class="pos-header">
    <div class="brand small">
      <div class="brand-mark">●</div>
      <h1>Simple<span class="accent">POS</span></h1>
    </div>
    <div class="header-right">
      <span id="welcome-user">Hi, user</span>
      <button id="logout-btn" class="btn-outline">Logout</button>
    </div>
  </header>

  <main class="pos-main">
    <section class="products-panel">
      <h2>Products</h2>
      <div id="product-grid" class="product-grid"></div>
    </section>

    <section class="cart-panel">
      <h2>Current Order</h2>
      <div id="cart-items" class="cart-items">
        <p class="empty-cart">No items yet — tap a product to add it.</p>
      </div>

      <div class="cart-summary">
        <div class="summary-row">
          <span>Total</span>
          <span id="cart-total" class="accent-text">₱0.00</span>
        </div>
        <button id="checkout-btn" class="btn-primary" disabled>Checkout</button>
        <button id="clear-btn" class="btn-outline">Clear Order</button>
      </div>
    </section>
  </main>

<script src="app.js"></script>
</body>
</html>
